<html lang="en">
		<head>
			<title>X-Raiders — Play in your browser</title>
            <meta name="description" content="Play the Tomb Raider I City of Vilcabamba demo in your desktop browser. No installation required.">
            <link rel="canonical" href="https://b00ag3.github.io/x-raiders/">
            <meta property="og:type" content="website">
            <meta property="og:title" content="X-Raiders — Play in your browser">
            <meta property="og:description" content="Play the Tomb Raider I City of Vilcabamba demo. Desktop keyboard controls; no installation required.">
            <meta property="og:url" content="https://b00ag3.github.io/x-raiders/">
            <meta property="og:image" content="https://b00ag3.github.io/x-raiders/preview.png">
            <meta name="twitter:card" content="summary_large_image">
            <meta name="twitter:title" content="X-Raiders — Play in your browser">

			<style>
			html {
				overflow: auto;
			}
			body {
				margin: 0 auto;
                padding: 1rem;
                max-width: 1100px;
                font: 1rem/1.5 system-ui, sans-serif;
                color: #000;
                background: #fff;
			}
			.game_fs {
				position: fixed;
				top: 0px;
				left: 0px;
				margin: 0px;
				width: 100%;
				height: 100%;
				border: 0;
				display: block;
			}
			table {
				border-collapse: collapse;
			}

			table, th, td {
				border: 1px solid black;
				padding: 4px;
			}
			
            .game { display: block; width: 100%; aspect-ratio: 854 / 480; height: auto; background: #000; touch-action: none; }
            .game:fullscreen { width: 100vw; height: 100vh; }
            button, input { font: inherit; }
            button { min-height: 44px; touch-action: manipulation; }
            :focus-visible { outline: 3px solid #000; outline-offset: 3px; }
            canvas:focus-visible { outline-color: #666; }
            h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
            #status { min-height: 1.5em; }
            #status { overflow-wrap: anywhere; }
            .toolbar { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
            #fullGame { display: none; }
            .embedded body { margin: 0; padding: .5rem; max-width: none; height: 100vh; box-sizing: border-box; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: .5rem; }
            .embedded h1, .embedded #intro, .embedded #info, .embedded .game-break { display: none; }
            .embedded #fullGame { display: inline; }
            .embedded .game { width: 100%; height: 100%; min-height: 0; aspect-ratio: auto; }
            </style>
			<meta charset="utf-8">
			<meta name="apple-mobile-web-app-capable" content="yes">
			<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
			<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
			
		</head>
		<body>
			<h1>X-Raiders</h1>
            <p id="intro">Tomb Raider I demo · City of Vilcabamba · Desktop keyboard required</p>
            <div class="toolbar">
                <button id="goFS" disabled>Go fullscreen</button>
                <button id="retryGame" hidden>Reload game</button>
                <a id="fullGame" href="./" target="_blank" rel="noopener">Open full game</a>
            </div>
			<canvas class="game" id="canvas" tabindex="0" aria-label="Tomb Raider game. Use arrow keys to move, Space to jump, Control for actions and Escape for the inventory." width="854" height="480" oncontextmenu="event.preventDefault()"></canvas><br class="game-break">
			<div id="status" role="status" aria-live="polite">Loading engine…</div>
			<script>
				var statusElement = document.getElementById('status');
				var canvasElement = document.getElementById('canvas');
				var proc;
                var gameFailed = false;
                function gameLoadError(reason) {
                    gameFailed = true;
                    var detail = String(reason && reason.message || reason || 'Unknown startup error');
                    statusElement.textContent = 'The game could not load: ' + detail + '. Choose Reload game to retry.';
                    document.getElementById('retryGame').hidden = false;
                    document.getElementById('goFS').disabled = true;
                    document.getElementById('browseLevel').disabled = true;
                    console.error(reason);
                }
                document.getElementById('retryGame').addEventListener('click', function() {
                    var freshURL = new URL(location.href);
                    freshURL.searchParams.set('reload', Date.now());
                    location.replace(freshURL.href);
                });

				function fullscreen(container) {
					Module.ccall('change_fs_mode', null, [], []);
					canvasElement.focus();
				}

				var goFS = document.getElementById("goFS");
				document.getElementById("goFS").style.display = 'block';
				goFS.addEventListener("click", function() { fullscreen(canvasElement); }, false);

				var Module = {
                    onRuntimeInitialized: function() {
                        Module.setStatus('Starting game…');
                    },
                    onAbort: gameLoadError,
					preRun: [],
					postRun: [],
					print: (function() {
								return function(text) {
									if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
									console.log(text);
								};
							})(),
					printErr: function(text) {
						if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
						if (0) {
							dump(text + '\n');
						} else {
							console.error(text);
						}
					},
					canvas: (function() {
						canvasElement.addEventListener("webglcontextlost", function(e) { Module.setStatus('Graphics connection lost. Reload the page to recover.'); e.preventDefault(); }, false);
						return canvasElement;
					})(),
					setStatus: function(text) {
						if (gameFailed) return;
						if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
						if (text === Module.setStatus.text) return;
						statusElement.textContent = text;
					},
					totalDependencies: 0,
					monitorRunDependencies: function(left) {
						this.totalDependencies = Math.max(this.totalDependencies, left);
						Module.setStatus(left ? 'Preparing… (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'Preparing engine…');
					},
				};

				var audioContext = null;

				function snd_init() {
					var AudioContext = window.AudioContext || window.webkitAudioContext;
					if (!AudioContext) return;
                    try {
					    audioContext = new AudioContext();
                        // Gameplay starts silently, including in an autoplay-enabled frame.
                        audioContext.suspend();
					var count  = 4096;
					var rate   = 44100 / audioContext.sampleRate;
					var framesCount = Math.ceil(count * rate);
					var frames = Module._malloc(framesCount * 4); // interleaved short L, R
					proc = audioContext.createScriptProcessor(count, 2, 2);
					proc.onaudioprocess = function(e) {
						var L = e.outputBuffer.getChannelData(0),
							R = e.outputBuffer.getChannelData(1);
						Module.ccall('snd_fill', null, ['number', 'number'], [frames, framesCount]);
						for (var i = 0; i < count; i++) {
							var index = frames + Math.floor(i * rate) * 4; // 4 is sample frame stride in bytes
							L[i] = Module.getValue(index    , 'i16') / 0x8000;
							R[i] = Module.getValue(index + 2, 'i16') / 0x8000;
						}
					}
					proc.connect(audioContext.destination);
                    } catch (error) {
                        console.warn('Sound is unavailable; gameplay can continue.', error);
                    }
				}

				function getLanguage() {
					var lang = navigator.languages && navigator.languages[0] || navigator.language || navigator.userLanguage;
					if (!lang) return;
					var id = 0;
					lang = lang.substring(0, 2);
					if (lang == "fr") {
						id = 1;
					} else if (lang == "de") {
						id = 2;
					} else if (lang == "es") {
						id = 3;
					} else if (lang == "it") {
						id = 4;
					} else if (lang == "pl") {
						id = 5;
					} else if (lang == "pt") {
						id = 6;
					} else if (lang == "ru" || lang == "be" || lang == "uk") {
						id = 7;
					} else if (lang == "ja") {
						id = 8;
					} else if (lang == "gr") {
						id = 9;
					} else if (lang == "fi") {
                        id = 10;
                    } else if (lang == "cs") {
                        id = 11;
                    } else if (lang == "zh") {
                        id = 12;
                    } else if (lang == "hu") {
                        id = 13;
                    } else if (lang == "sv") {
                        id = 14;
                    }
					Module.ccall('set_def_lang', null, ['number'], [id]);
				}

			// unlock audio context after user interaction
				var userAction = function() {
					if (audioContext && audioContext.state == "suspended") {
						audioContext.resume().then(function() {
							window.removeEventListener('touchstart', userAction, false);
							window.removeEventListener('click', userAction, false);
                            window.removeEventListener('keydown', userAction, false);
							console.log("resume playback");
						}).catch(function() {
                            // Keep listening so the next interaction can retry.
                        });
					}
				};
				window.addEventListener('touchstart', userAction, false);
				window.addEventListener('click', userAction, false);
                window.addEventListener('keydown', userAction, false);

				Module.setStatus('Loading engine…');
                window.onerror = function(message, source, line, column, error) {
                    gameLoadError(error || message);
                };
                window.addEventListener('unhandledrejection', function(event) {
                    gameLoadError(event.reason);
                });
			</script>

			<div id="info">
				<input type="file" id="browseFile" aria-label="Choose a Tomb Raider level file" style="display:none" accept=".phd,.psx, .tr2, .tr4" onchange="readLevel(event)" />
				<button id="browseLevel" disabled onclick="document.getElementById('browseFile').click();">Load your own level</button> (.PHD, .PSX, .TR2, .TR4)&nbsp;
				
                <p>Click the game to focus it. Arrow keys: move · Space: jump · Control: action · Escape: inventory.</p>

			</div>

			<script>
                function browserGameReady() {
                    if (gameFailed) return;
                    document.getElementById('goFS').disabled = false;
                    document.getElementById('browseLevel').disabled = false;
                    Module.setStatus('Playing the demo. Click the game to focus the controls.');
                    if (document.activeElement === document.body && window.matchMedia('(pointer: fine)').matches) {
                        canvasElement.focus({ preventScroll: true });
                    }
                }

                async function loadBrowserEngine() {
                    var controller = new AbortController();
                    var timeout = setTimeout(function() { controller.abort(); }, 20000);
                    try {
                        // Always resolve the current release, even when the HTML is cached.
                        var manifestURL = new URL('build.json', location.href);
                        manifestURL.searchParams.set('fresh', Date.now());
                        var response = await fetch(manifestURL, { cache: 'no-store', signal: controller.signal });
                        if (!response.ok) throw new Error('Engine manifest download failed (HTTP ' + response.status + ')');
                        var release = await response.json();
                        if (!/^xraiders-[a-f0-9]{16}\.js$/.test(release.engine)) throw new Error('Invalid engine manifest');
                        var engineURL = new URL(release.engine, manifestURL);
                        Module.locateFile = function(path) { return new URL(path, engineURL).href; };
                        var script = document.createElement('script');
                        script.src = engineURL.href;
                        script.onerror = function() { gameLoadError('Engine download failed'); };
                        document.body.appendChild(script);
                    } catch (error) {
                        gameLoadError(error.name === 'AbortError' ? 'Engine download timed out' : error);
                    } finally {
                        clearTimeout(timeout);
                    }
                }
                loadBrowserEngine();

				function readLevel(event) {
					if (!event.target.files.length) return;
                    var file = event.target.files[0];
                    if (!/\.(phd|psx|tr2|tr4)$/i.test(file.name) || file.size < 1024 || file.size > 64 * 1024 * 1024) {
                        Module.setStatus('Choose a Tomb Raider level file (.PHD, .PSX, .TR2 or .TR4), up to 64 MB.');
                        return;
                    }
                    var reader = new FileReader();
                    reader.onerror = function() { Module.setStatus('Could not read that level. Choose another file.'); };
					reader.onload = function(){
						var size = reader.result.byteLength;
						var data = Module._malloc(size);
						Module.writeArrayToMemory(new Uint8Array(reader.result), data);
						Module.ccall('game_level_load', null, ['number', 'number'], [data, size]);
                        canvasElement.focus();
                        Module.setStatus('Playing your selected level.');
					};
					reader.readAsArrayBuffer(event.target.files[0]);
				}
				
			</script>
		
		</body>
</html>
